<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar Booking System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #faedff;
            color: #6A14BE;
        }

        .booking-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        input, button {
            margin: 10px 0;
            padding: 10px;
            width: 100%;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            background-color: #6A14BE;
            color: white;
            cursor: pointer;
            border: none;
        }

        button:hover {
            background-color: #6A14BE;
            opacity: 0.5;
        }

        /* Popup Styling */
        .popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .popup-content {
            display: block;  /* ✅ FIX: Ensure popup content is visible */
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.3);
        }

        .popup-content button {
            background-color: #6A14BE;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            margin-top: 10px;
            border-radius: 5px;

        }
    </style>

    <script>
        function bookAppointment() {
            const date = document.getElementById("date").value;
            const time = document.getElementById("time").value;

            if (!date || !time) {
                document.getElementById("message").textContent = "⚠️ Please select a date and time!";
                return;
            }

            document.getElementById("popup-message").textContent = "Your booking for " + date + " at " + time + " is confirmed!🎉";
            document.getElementById("popup").style.display = "flex";  // Show the popup

            // Simulate sending data to server
            const bookingData = { date, time };

            fetch('/book', {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(bookingData)
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById("message").textContent = data.message;
            })
            .catch(error => {
                console.error("Error:", error);
            });
        }

        function closePopup() {
            document.getElementById("popup").style.display = "none";
            window.location.href = "../Dashboard/Dashboard.html";
        }
    </script>
</head>
<body>

    <div class="booking-container">
        <h2>Book a Viewing</h2>
        <label for="date">Select Date:</label>
        <input type="date" id="date">
        
        <label for="time">Select Time:</label>
        <input type="time" id="time">

        <button onclick="bookAppointment()">Book Now</button>
        
        <p id="message"></p>

        <div id="popup" class="popup">
            <div class="popup-content">
                <p id="popup-message"> We have booked your viewing successfully! 🎉</p>
                <button onclick="closePopup()">OK</button>
            </div>
        </div>
        
    </div>

</body>
</html>
