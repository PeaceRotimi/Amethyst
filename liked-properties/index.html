<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Oswald:wght@200..700&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Oswald:wght@200..700&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <title>Liked Homes - Next Steps</title>
  </head>
  <body>
    <h1 class="liked-properties-h1">Liked Properties</h1>
    <div id="liked-properties-container"></div>

    <div class="btn-container swiper-nav">
      <button class="swiper-nav-btn" onclick="toSwiperPage()">
        View more properties
      </button>
      <button
        class="swiper-nav-btn swiper-dashboard-btn"
        onclick="toDashboard()"
      >
        Dashboard
      </button>
    </div>
    <script>
      function toSwiperPage() {
        window.location.href = "../swipe-properties/index.html";
      }
      function toDashboard() {
        window.location.href = "../Dashboard/Dashboard.html";
      }

      document.addEventListener("DOMContentLoaded", () => {
        const container = document.getElementById("liked-properties-container");

        // Retrieve liked properties from localStorage
        let likedProperties =
          JSON.parse(localStorage.getItem("likedProperties")) || [];

        if (likedProperties.length === 0) {
          container.innerHTML = "<p>No properties liked yet.</p>";
          return;
        }

        likedProperties.forEach((imgSrc) => {
          const card = document.createElement("div");
          card.classList.add("property-card");

          const img = document.createElement("img");
          img.src = imgSrc;
          img.alt = "Liked Property";

          const buttonContainer = document.createElement("div");
          buttonContainer.classList.add("card-buttons");

          const chatButton = document.createElement("button");
          chatButton.classList.add("chat-btn");
          chatButton.innerText = "Chat";
          chatButton.addEventListener("click", () => {
            window.location.href = "../chat/chat.html";
          });

          const bookButton = document.createElement("button");
          bookButton.classList.add("book-btn");
          bookButton.innerText = "Book Visit";
          bookButton.addEventListener("click", () => {
            alert("Booking feature coming soon!"); // Replace with actual booking functionality
          });

          buttonContainer.appendChild(chatButton);
          buttonContainer.appendChild(bookButton);

          card.appendChild(img);
          card.appendChild(buttonContainer);
          container.appendChild(card);
        });
      });
    </script>
  </body>
</html>
