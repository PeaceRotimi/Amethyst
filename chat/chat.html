<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Oswald:wght@200..700&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Oswald:wght@200..700&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <title>Chat With The Landlord</title>
  </head>
  <body>
    <h1>Chat To Learn More!</h1>
    <div class="card-container">
      <div class="card-header">
        <div class="img-avatar"></div>
        <div class="text-chat">Landlord</div>
      </div>
      <div class="card-body">
        <div class="messages-container">
          <div class="message-box left">
            <p>Hello, How are you?</p>
          </div>
          <div class="message-box right">
            <p>I'm good, thanks for asking! How about you?</p>
          </div>
        </div>
        <div class="message-input">
          <form>
            <textarea
              placeholder="Type your message here"
              class="message-send"
            ></textarea>
            <button type="submit" class="button-send">Send</button>
          </form>
        </div>
      </div>
    </div>
    <div class="btn-container swiper-nav">
      <button class="swiper-nav-btn" onclick="toSwiperPage()">
        View more properties
      </button>
      <button
        class="swiper-nav-btn swiper-dashboard-btn"
        onclick="toDashboard()"
      >
        Dashboard
      </button>
    </div>
    <script>
      function toSwiperPage() {
        window.location.href = "../swipe-properties/index.html";
      }

      function toDashboard() {
        window.location.href = "../Dashboard/Dashboard.html";
      }
    </script>
  </body>
</html>
